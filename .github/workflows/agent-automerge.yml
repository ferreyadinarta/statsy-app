# Merges the daily marketing agent's session branch (claude/**) into main.
# The cloud agent can only push to its own branch; this lands that work on main
# (which triggers the Vercel deploy) as long as it only touches content files.
name: Agent auto-merge

on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write

concurrency:
  group: agent-automerge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only allow content paths
        run: |
          changed=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"; echo "$changed"
          blocked=$(echo "$changed" | grep -vE '^(content/blog/|marketing/|public/llms\.txt$)' || true)
          if [ -n "$blocked" ]; then
            echo "::error::Branch touches files outside content/blog/, marketing/, public/llms.txt. Not merging:"
            echo "$blocked"
            exit 1
          fi

      - name: Rebase onto main and push
        run: |
          git config user.name "Ferrey Adinarta"
          git config user.email "100986961+ferreyadinarta@users.noreply.github.com"
          git rebase origin/main
          git push origin HEAD:main

      - name: Delete the merged branch
        run: git push origin --delete "${GITHUB_REF_NAME}"
